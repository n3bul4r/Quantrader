# Prop-firm program presets.
#
# !!! These are PLANNING VALUES compiled 2026-11 from Topstep's help center and
# third-party summaries that partly disagree with each other (see docs/RESEARCH.md).
# Firms change rules several times a year. Verify every number on the firm's own
# rulebook / dashboard before buying, and edit this file. The simulator is only as
# good as these inputs.
#
# Conventions: all money in USD, relative to the phase's starting balance.
#   drawdown_type: eod_trailing | intraday_trailing | static
#   lock_level:    highest level (relative to start) the max-loss level can trail to;
#                  0 = MLL stops at the starting balance; null = trails forever.
#   dll_action:    pause (day over, account survives) | fail (account lost)
#   consistency_pct (eval): best day must be <= pct * total profit to pass
#   payout_consistency_pct (funded): best day since last payout <= pct * profit since last payout
#   mll_after_payout: unchanged | lock_at_start (MLL moves to the starting balance)

topstep_50k:
  firm: Topstep
  name: "Topstep 50K Trading Combine -> Express Funded (Standard payout path)"
  account_size: 50000
  eval_fee: 49            # monthly subscription (verify current price / promos)
  eval_fee_recurring_days: 21
  activation_fee: 149     # XFA activation (some plans have none — verify)
  max_accounts: 5
  automation: "API bots allowed on Combine/XFA via TopstepX (ProjectX); not on Live Funded; no HFT"
  last_checked: "2026-11 (secondary sources; MLL-after-payout and caps unverified)"
  evaluation:
    profit_target: 3000
    max_loss: 2000
    drawdown_type: eod_trailing
    lock_level: 0
    daily_loss_limit: null   # reported optional on standard Combine; guard enforces our own
    dll_action: pause
    consistency_pct: 0.50
    min_trading_days: 2
    max_micros: 50
  funded:
    profit_target: null
    max_loss: 2000
    drawdown_type: eod_trailing
    lock_level: 0
    daily_loss_limit: null
    dll_action: pause
    consistency_pct: null
    min_trading_days: 0
    max_micros: 50
    scaling_plan: [[0, 20], [1500, 30], [2000, 50]]   # [profit >=, max micros]
    payout_winning_days: 5
    winning_day_threshold: 150
    payout_fraction: 0.50
    payout_cap: 2000          # reported per-cycle cap for 50K standard path (Apr 2026) — verify
    payout_min: 125
    profit_split: 0.90
    full_split_first: 0
    payout_consistency_pct: null
    mll_after_payout: lock_at_start

